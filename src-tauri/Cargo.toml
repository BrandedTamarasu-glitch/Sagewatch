[package]
name = "sagewatch"
version = "0.1.0"
description = "Local Claude and Codex allowance status"
authors = ["Sagewatch contributors"]
edition = "2021"

[lib]
name = "sagewatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde", "clock"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "process", "io-util"] }

[dev-dependencies]
tempfile = "3"
